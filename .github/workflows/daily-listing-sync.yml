name: Daily housing notice sync

on:
  schedule:
    # GitHub Actions cron은 UTC 기준: 01:00 UTC = 10:00 KST
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: daily-housing-notice-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect official notices and recalculate matches
        shell: bash
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if [ "$attempt" -lt "$max_attempts" ]; then
              notify_sync_failure=false
            else
              notify_sync_failure=true
            fi
            if NOTIFY_SYNC_FAILURE="$notify_sync_failure" npm run sync:listings; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              exit 1
            fi
            delay_seconds=$((attempt * 60))
            echo "공고 동기화 연결 실패. ${delay_seconds}초 후 다시 시도합니다. (${attempt}/${max_attempts})"
            sleep "$delay_seconds"
          done
        env:
          PUBLIC_SERVICE_KEY: ${{ secrets.PUBLIC_SERVICE_KEY }}
          LH_ANNOUNCEMENT_API_URL: ${{ secrets.LH_ANNOUNCEMENT_API_URL }}
          LH_SUPPLY_API_URL: ${{ secrets.LH_SUPPLY_API_URL }}
          LH_SUPPLY_DETAIL_API_URL: ${{ secrets.LH_SUPPLY_DETAIL_API_URL }}
          LH_ALLOW_HTTP_FALLBACK: 'true'
          HUG_LISTINGS_API_URL: ${{ secrets.HUG_LISTINGS_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Analyze eligibility rules and required documents
        run: npm run analyze:documents
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Recalculate personalized matches with document rules
        run: npm run recalculate:matches
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
